<div class="max-w-3xl mx-auto px-4 py-8">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <p-stepper [value]="1" class="w-full" #step>
      <!-- Mobile step indicator -->
      <div class="sm:hidden mb-6 text-center text-sm font-medium text-gray-600 dark:text-gray-400">
        Step {{ step.value() }} of 3
      </div>

      <!-- Desktop stepper -->
      <div class="hidden sm:block mb-8">
        <p-step-list>
          <p-step [value]="1">Personal details</p-step>
          <p-step [value]="2" [disabled]="!isStepValid(1)" (click)="changeStep(2)">
            Contact information
          </p-step>
          <p-step
            [value]="3"
            [disabled]="!isStepValid(1) || !isStepValid(2)"
            (click)="changeStep(3)"
          >
            Confirmation
          </p-step>
        </p-step-list>
      </div>

      <p-step-panels>
        <!-- STEP 1 -->
        <p-step-panel [value]="1">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="flex flex-col items-center gap-5">
              <div class="field w-full sm:w-1/2">
                <p-iftalabel>
                  <input
                    pInputText
                    fluid
                    id="firstName"
                    formControlName="firstName"
                    autocomplete="off"
                  />
                  <label for="firstName">First name</label>
                </p-iftalabel>
                <app-field-error-validation [control]="form.get('firstName')">
                </app-field-error-validation>
              </div>

              <div class="field w-full sm:w-1/2">
                <p-iftalabel>
                  <input
                    pInputText
                    fluid
                    id="lastName"
                    formControlName="lastName"
                    autocomplete="off"
                  />
                  <label for="lastName">Last name</label>
                </p-iftalabel>
                <app-field-error-validation [control]="form.get('lastName')">
                </app-field-error-validation>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 sm:justify-end mt-8 w-full">
              <p-button
                label="Next"
                icon="pi pi-arrow-right"
                iconPos="right"
                size="large"
                [fluid]="true"
                (onClick)="onNext(activateCallback, 1, 2)"
              >
              </p-button>
            </div>
          </ng-template>
        </p-step-panel>

        <!-- STEP 2 -->
        <p-step-panel [value]="2">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="flex flex-col items-center gap-5">
              <div class="field w-full sm:w-1/2">
                <p-iftalabel>
                  <input
                    pInputText
                    fluid
                    id="email"
                    formControlName="email"
                    inputmode="email"
                    autocomplete="off"
                  />
                  <label for="email">Email</label>
                </p-iftalabel>
                <app-field-error-validation [control]="form.get('email')">
                </app-field-error-validation>
              </div>

              <div class="field w-full sm:w-1/2">
                <p-iftalabel>
                  <input
                    pInputText
                    fluid
                    id="emailConfirmation"
                    formControlName="emailConfirmation"
                    inputmode="email"
                    autocomplete="off"
                  />
                  <label for="emailConfirmation">Email confirmation</label>
                </p-iftalabel>
                <app-field-error-validation [control]="form.get('emailConfirmation')">
                </app-field-error-validation>
              </div>

              <div class="field w-full sm:w-1/2">
                <p-iftalabel>
                  <p-inputmask
                    id="phone"
                    fluid
                    formControlName="phone"
                    mask="(99) 99999-9999"
                    inputmode="tel"
                    autocomplete="off"
                  >
                  </p-inputmask>
                  <label for="phone">Phone</label>
                </p-iftalabel>
                <app-field-error-validation [control]="form.get('phone')">
                </app-field-error-validation>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 sm:justify-between mt-8 w-full">
              <p-button
                label="Back"
                severity="secondary"
                icon="pi pi-arrow-left"
                size="large"
                [fluid]="true"
                (onClick)="onBack(activateCallback, 1)"
              >
              </p-button>

              <p-button
                label="Next"
                icon="pi pi-arrow-right"
                iconPos="right"
                size="large"
                [fluid]="true"
                (onClick)="onNext(activateCallback, 2, 3)"
              >
              </p-button>
            </div>
          </ng-template>
        </p-step-panel>

        <!-- STEP 3 -->
        <p-step-panel [value]="3">
          <ng-template #content let-activateCallback="activateCallback">
            <app-data-viewer [values]="formState.formStateSnapshot()?.values"> </app-data-viewer>

            <div class="flex flex-col sm:flex-row gap-3 sm:justify-between mt-8 w-full">
              <p-button
                label="Back"
                severity="secondary"
                icon="pi pi-arrow-left"
                size="large"
                [fluid]="true"
                (onClick)="onBack(activateCallback, 2)"
              >
              </p-button>

              <p-button type="submit" label="Confirm" [disabled]="form.invalid" size="large" [fluid]="true"> </p-button>
            </div>
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>
  </form>
</div>
