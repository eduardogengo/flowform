<p-card>
  <div class="flex flex-col items-center">
    <div class="w-full max-w-md">
      @if (values()) {
        <div class="space-y-4">
          <!-- First Name -->
          <div class="border-b border-gray-200 dark:border-gray-700 pb-3">
            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase mb-1">First name</p>
            <p class="text-gray-900 dark:text-white break-words">{{ values()?.firstName || '-' }}</p>
          </div>

          <!-- Last Name -->
          <div class="border-b border-gray-200 dark:border-gray-700 pb-3">
            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase mb-1">Last name</p>
            <p class="text-gray-900 dark:text-white break-words">{{ values()?.lastName || '-' }}</p>
          </div>

          <!-- Email -->
          <div class="border-b border-gray-200 dark:border-gray-700 pb-3">
            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase mb-1">Email</p>
            <p class="text-gray-900 dark:text-white break-words">{{ values()?.email || '-' }}</p>
          </div>

          <!-- Phone -->
          <div class="pb-3">
            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase mb-1">Phone</p>
            <p class="text-gray-900 dark:text-white break-words">{{ values()?.phone || '-' }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</p-card>
